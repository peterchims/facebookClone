<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Section Example</title>
    <link rel="stylesheet" href="styles.css">
<style>
    section {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #ccc;
    background-color: #f9f9f9;
}

<body>
    <button id="toggleButton">Show Section</button>
    <section id="mySection" style="display: none;">

        <p>Here is some content in the section.</p>
    </section>
    <script src="./test.js">
  
    </script>
